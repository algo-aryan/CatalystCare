<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="grad1" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#0d9488" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="grad2" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="grad3" cx="20%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0.10" />
      <stop offset="70%" stop-color="#0f766e" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="glassWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#d1fae5" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ccfbf1" stop-opacity="0.4" />
    </linearGradient>
    <filter id="glassBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="90" result="blur" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Ambient light discs -->
  <rect width="1920" height="1080" fill="#f8fafc" />
  <circle cx="960" cy="240" r="500" fill="url(#grad1)" filter="url(#glassBlur)" />
  <circle cx="1600" cy="180" r="450" fill="url(#grad2)" filter="url(#glassBlur)" />
  <circle cx="300" cy="720" r="550" fill="url(#grad3)" filter="url(#glassBlur)" />
  
  <!-- Curved translucent glass ribbon overlays -->
  <path d="M-100,280 C400,120 700,420 1200,260 C1600,120 1800,340 2100,220 L2100,1200 L-100,1200 Z" fill="url(#glassWave)" filter="url(#softGlow)" opacity="0.45" />
  <path d="M-50,600 C500,450 800,750 1400,560 C1750,420 1950,650 2150,540 L2150,1200 L-50,1200 Z" fill="#ffffff" filter="url(#glassBlur)" opacity="0.6" />
</svg>
